<section class="actor-list-container">
  <h2>Actores</h2>

  <p *ngIf="isLoading" class="loading-message">Cargando actores...</p>
  <p *ngIf="error" class="error-message">{{ error }}</p>

  <div *ngIf="!isLoading && !error && actors.length > 0" class="actor-grid">
    <article class="actor-card" *ngFor="let actor of actors">
      <img
        [src]="actor.foto"
        [alt]="actor.nombre + ' ' + actor.apellido"
        class="actor-photo"
      />

      <div class="actor-info">
        <h3>{{ actor.nombre }} {{ actor.apellido }}</h3>
        <p>Calificación: {{ actor.calificacion }}</p>
      </div>
    </article>
  </div>

  <p *ngIf="!isLoading && !error && actors.length === 0" class="no-actors-message">
    No se encontraron actores.
  </p>
</section>
